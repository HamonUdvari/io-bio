# Auto-refresh the SANDBOX Zenodo deposits when the print template / CSS or entry
# content changes on main, so the demo's per-entry "How to cite" deposits track
# the design as it evolves. SANDBOX ONLY — production minting stays in the gated,
# manual zenodo-mint.yml (this workflow never touches production).
#
# OPT-IN — dormant until you set BOTH (Settings → Secrets and variables → Actions):
#   • repo VARIABLE  ZENODO_SANDBOX_AUTOMINT = true
#   • repo SECRET    ZENODO_SANDBOX_TOKEN     (a sandbox.zenodo.org API token)
# Until the variable is "true" the job is skipped, so it never runs, fails, or mints.
#
# Why it's cheap: the mint folds a print-template fingerprint (renderVersion) into
# the SANDBOX idempotency hash, so it re-versions only entries whose CONTENT or
# LAYOUT actually changed and skips the rest — a no-op when nothing relevant moved.
name: Zenodo sandbox refresh (auto)

on:
  push:
    branches: [main]
    paths:
      # Print template / styling → bumps renderVersion (re-renders all PDFs).
      # Keep in sync with PRINT_TEMPLATE_FILES/DIRS in scripts/zenodo-mint.ts.
      - "src/styles/global.css"
      - "src/pages/print/**"
      - "src/components/EntryArticle.astro"
      - "src/components/Image.astro"
      - "src/utils/displayName.ts"
      - "src/utils/imageSource.ts"
      - "src/remarkPlugins/**"
      - "src/rehypePlugins/**"
      - "astro.config.mjs"
      # Entry content / extraction → bumps the per-entry content hash:
      - "src/content/bios/**"
      - "src/loaders/**"
      - "patches/**" # dependency patches, e.g. the officeparser Word-parsing fix
      - "src/content.config.ts"
      - "src/pages/zenodo-meta.json.ts"
      # Also in the content hash (scripts/lib/zenodo-content.ts): the CMS
      # default editors, per-entry overrides (details, roles, portrait choice),
      # uploaded portraits, and the acronym map (roles → record keywords).
      - "src/content/globals/citation.md"
      - "src/data/entry-overrides/**"
      - "src/content/bios-images/**"
      - "src/data/org-abbreviations.json"
      # Rights note (single source) → folded into the state hash (see
      # computeStateHash), so a CMS edit re-versions the deposits.
      - "src/content/globals/rights.md"
      # The mint pipeline itself:
      - "scripts/zenodo-*.ts"
      - "scripts/lib/zenodo-*.ts"
  workflow_dispatch:

permissions:
  contents: write # to commit the refreshed sandbox DOI map
  actions: write # to dispatch the Deploy workflow after pushing the map

concurrency:
  group: zenodo-sandbox
  cancel-in-progress: false

jobs:
  refresh:
    # Opt-in: only runs once the maintainer enables it (see header).
    if: ${{ vars.ZENODO_SANDBOX_AUTOMINT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The LATEST main, not the (possibly older) commit a queued run was
          # triggered by — so the refresh starts from the current map.
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      # Convert non-web embedded images (e.g. Prebisch's .tif) to PNG at build
      # time — the runner lacks LibreOffice by default, so without this the
      # entry PDF is rendered without its portrait. Mirrors deploy.yml.
      - name: Install LibreOffice (headless image conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-draw
          soffice --version
      - name: Build (emits dist/zenodo-meta.json + the /print routes)
        run: pnpm run build
      - name: Refresh sandbox deposits (re-versions changed content/layout only)
        id: mint
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm run zenodo:mint:sandbox
      - name: Commit refreshed sandbox DOI map + trigger deploy
        # Runs even when the refresh step FAILED or was cancelled: the mint saves
        # the map after every successful entry, so a partial run still holds new
        # DOIs. Skipping this commit would lose them, and the next run would mint
        # those entries again (duplicate deposits). The job still ends as failed.
        # Skipped only when the refresh never started.
        if: ${{ always() && steps.mint.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for `gh workflow run` (Deploy dispatch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MAP=src/data/zenodo-dois.sandbox.json
          if [ -z "$(git status --porcelain -- "$MAP")" ]; then
            echo "no sandbox map changes to commit"
            exit 0
          fi
          # Same commit logic as zenodo-mint.yml — keep the two in sync.
          # Keep the map this run started from (base) and the one it minted (ours).
          git show "HEAD:$MAP" > "$RUNNER_TEMP/base-map.json" 2>/dev/null ||
            echo "{}" > "$RUNNER_TEMP/base-map.json"
          cp "$MAP" "$RUNNER_TEMP/doi-map.json"
          # Whatever fails below before the map lands on main, print this run's
          # changed records so they can be added by hand.
          pushed=false
          trap '[ "$pushed" = true ] || { echo "::error::sandbox map NOT pushed — add (or replace) the records below in $MAP on main by hand, keeping all other records"; cat "$RUNNER_TEMP/doi-delta.json" 2>/dev/null || cat "$RUNNER_TEMP/doi-map.json"; }' EXIT
          node scripts/zenodo-merge-map.ts "$RUNNER_TEMP/base-map.json" "$RUNNER_TEMP/doi-map.json" "$RUNNER_TEMP/doi-delta.json"
          # Merge onto the LATEST main and push, retrying if main advances meanwhile.
          # Only the records this run changed are applied (a print-template change
          # re-versions — so changes — every record), so a hand fix to the map
          # committed during the run (e.g. a wedge recovery) is never reverted.
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "fetch failed; retrying ($attempt/5)"
              sleep 5
              continue
            fi
            git reset --hard FETCH_HEAD
            node scripts/zenodo-merge-map.ts "$RUNNER_TEMP/base-map.json" "$RUNNER_TEMP/doi-map.json" "$MAP"
            if [ -n "$(git status --porcelain -- "$MAP")" ]; then
              git add -- "$MAP"
              git commit -m "chore(zenodo): refresh sandbox deposits [skip ci]"
              if ! git push origin HEAD:main; then
                echo "push rejected (main advanced); retrying ($attempt/5)"
                sleep 5
                continue
              fi
              echo "pushed sandbox map (attempt $attempt)"
            else
              echo "sandbox map already current on main"
            fi
            pushed=true
            # The DOI map is read at BUILD time, so a freshly-minted DOI only reaches
            # the live entry page when the site rebuilds. This commit does NOT trigger
            # Deploy by itself: a push made with the default GITHUB_TOKEN never starts
            # a new workflow run (GitHub's recursion guard), and `[skip ci]` makes that
            # explicit. So we DISPATCH Deploy ourselves — workflow_dispatch IS exempt
            # from that guard, even via GITHUB_TOKEN (needs `actions: write`). No loop:
            # this GITHUB_TOKEN push starts no workflow, the map file isn't in this
            # workflow's `paths:`, and Deploy makes no commits.
            echo "dispatching Deploy"
            gh workflow run deploy.yml --ref main
            exit 0
          done
          echo "::error::could not push refreshed sandbox map after 5 attempts"
          exit 1
