name: Release
on:
  push:
    branches: [main]
    # The Zenodo mint bots commit only the DOI map(s). Those are `chore` commits
    # that never cut a release, and the sandbox-refresh commit now runs without a
    # skip-ci marker (so it can trigger Deploy) — which would otherwise spin up a
    # full, pointless Release build on every refresh. Skip Release for map-only
    # changes. (Deploy has no path filter, so it still runs on the map commit.)
    paths-ignore:
      - "src/data/zenodo-dois*.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize releases: if two commits land close together, run them one at a time
# (the second finds nothing new and no-ops). Do NOT cancel-in-progress — a release
# mid-run is tagging/pushing a changelog + GitHub release and must never be halted.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
