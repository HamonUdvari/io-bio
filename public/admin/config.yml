# Sveltia CMS configuration for IO BIO.
# Docs: https://sveltiacms.app/en/docs/intro
#
# LOCAL editing (no login needed): run `pnpm dev`, open
#   http://localhost:4321/io-bio/admin/index.html
# in Chrome/Edge/Brave, click "Work with Local Repository", pick the repo root.
#
# LIVE login (no extra hosting): editors click "Sign in with Token" on the login
# screen and paste a GitHub fine-grained personal access token scoped to this
# repo (GitHub provides a pre-filled link). No Cloudflare / OAuth backend needed.
# (When GitHub ships client-side PKCE, this becomes one-click with still no
# backend — no config change required.)
#
# `auth_methods: [token]` hides the "Sign in with GitHub" (OAuth) button, which
# without an OAuth backend just 404s against Netlify. Only token sign-in is shown
# (plus "Work with Local Repository" in local dev).

backend:
  name: github
  repo: HamonUdvari/io-bio
  branch: main
  auth_methods: [token]

site_url: https://hamonudvari.github.io/io-bio

# Global media (page images, downloadable PDFs) live in public/ — this is the
# general "All assets". The bio Word files get their OWN labeled folder in the
# Asset Library via the "Bio Word files" collection below.
media_folder: public
public_folder: /

collections:
  # ---------- Site text ----------
  - name: site
    label: Site text
    delete: false
    files:
      - name: hero
        label: Home page (hero)
        file: src/content/globals/hero.md
        fields:
          - label: Buttons
            name: links
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - { label: Hero text, name: body, widget: text }
      - name: footer
        label: Footer
        file: src/content/globals/footer.md
        fields:
          - { label: Footer text, name: text, widget: text }
      - name: meta
        label: Browser tab & search text
        file: src/content/globals/global.md
        fields:
          - { label: Site title, name: title, widget: string }
          - { label: Search description, name: description, widget: text }
      - name: citation
        label: How to cite (default editors)
        file: src/content/globals/citation.md
        fields:
          - { label: Default editors credit, name: editors, widget: string, hint: "Fallback only. Each entry normally shows the editors from its own Word file's 'How to cite' line. This default is used only for an entry whose Word file has no editors (e.g. edited by Bob Reinalda, Kent J. Kille and Jaci L. Eisenberg)." }
      - name: rights
        label: Rights notice (entry footer)
        file: src/content/globals/rights.md
        fields:
          - { label: Rights notice, name: notice, widget: markdown, hint: "Legal footnote at the bottom of every entry and its PDF. Keep the license as a link, e.g. [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)." }

  # ---------- Pages (section block editor) ----------
  # Each page is a list of "section" blocks: add / reorder / delete blocks, each
  # with a heading, a style, a width, and rich-text content. No ::: syntax.
  - name: pages
    label: Pages
    delete: false
    files:
      - name: about
        label: About
        file: src/content/pages/about.md
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Search description, name: description, widget: text, required: false }
          - { label: Menu order, name: order, widget: number, required: false, value_type: int }
          - { label: URL name, name: slug, widget: hidden, default: about }
          - label: Sections
            name: sections
            label_singular: Section
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Heading, name: title, widget: string, required: false }
              - { label: Style, name: variant, widget: select, options: [primary, secondary], default: secondary, required: false }
              - { label: Width, name: stretch, widget: select, options: [base, wide], default: base, required: false }
              - { label: Content, name: content, widget: markdown, editor_components: [columns, file-link, people, contributors] }
      - name: author-instructions
        label: Author Instructions
        file: src/content/pages/author-instructions.md
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Search description, name: description, widget: text, required: false }
          - { label: Menu order, name: order, widget: number, required: false, value_type: int }
          - { label: URL name, name: slug, widget: hidden, default: author-instructions }
          - label: Sections
            name: sections
            label_singular: Section
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Heading, name: title, widget: string, required: false }
              - { label: Style, name: variant, widget: select, options: [primary, secondary], default: secondary, required: false }
              - { label: Width, name: stretch, widget: select, options: [base, wide], default: base, required: false }
              - { label: Content, name: content, widget: markdown, editor_components: [columns, file-link, people, contributors] }

  # ---------- Bio Word files ----------
  # Gives the bio .docx their OWN labeled folder in the Asset Library (the media
  # view), via this collection's media_folder. Manage the Word files THERE — add a
  # new one, or replace an existing one. (No editable entries: .docx can't be
  # text-edited; this collection only exists to give the files a labeled home.)
  - name: bio-files
    label: Bio Word files
    folder: src/content/bios
    extension: md
    create: false
    media_folder: /src/content/bios
    public_folder: /src/content/bios
    fields:
      - { label: Name, name: title, widget: string }

  # ---------- Roles & portraits (per entry) ----------
  # One editable card per bio, auto-synced 1:1 with the Word files. Search a
  # person, open the card, and you SEE that person's roles as read from the Word
  # file (WYSIWYG). Leave "Manual override of roles" OFF to keep them auto
  # (recommended); turn it ON to replace them by hand. The card also carries an
  # optional higher-res portrait (empty = use the Word photo) and a group-photo
  # face position. Cards are created/removed automatically to match the Word
  # files, so the flow is: drop the .docx first, then tweak overrides here.
  - name: entry-overrides
    label: Roles & portraits (per entry)
    label_singular: Entry
    folder: src/data/entry-overrides
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: name
    summary: "{{fields.name}}"
    sortable_fields: [name, rolesOverride]
    media_folder: /src/content/bios-images
    public_folder: /src/content/bios-images
    fields:
      - { label: Entry slug, name: slug, widget: hidden }
      - label: Person
        name: name
        widget: string
        hint: "Auto-filled from the Word file — don't edit; it only labels this list."
      - label: Manual override of roles
        name: rolesOverride
        widget: boolean
        default: false
        hint: "OFF = roles auto-read from the Word file (recommended). ON = the roles below REPLACE them."
      - label: Roles
        name: roles
        widget: list
        required: false
        summary: "{{fields.title}} — {{fields.organisation}} ({{fields.abbreviation}})"
        fields:
          - { label: Title, name: title, widget: string, hint: "e.g. Secretary-General" }
          - { label: Organisation, name: organisation, widget: string, required: false }
          - { label: Abbreviation, name: abbreviation, widget: string, required: false, hint: "leave blank to auto-fill from the acronym table" }
          - { label: Start year, name: startYear, widget: number, required: false, value_type: int, min: 1000, max: 2100 }
          - { label: End year, name: endYear, widget: number, required: false, value_type: int, min: 1000, max: 2100 }
          - { label: Ordinal text (optional), name: ordinalText, widget: string, required: false }
      - label: Portrait override (optional)
        name: portraitImage
        widget: image
        required: false
        media_folder: /src/content/bios-images
        public_folder: /src/content/bios-images
        hint: "Higher-res portrait. Leave empty to use the photo from the Word file."
      - label: Face position (group photos only)
        name: facePosition
        widget: number
        required: false
        value_type: int
        min: 1
        hint: "If a group photo crops the wrong person, set which face from the LEFT (1 = leftmost). Empty = the main face."

  # ---------- Settings ----------
  - name: settings
    label: Settings
    delete: false
    files:
      # Organization acronyms: fills the "(ACRONYM)" in the entries "Organization"
      # column when a Word file named the organization but not its acronym. An
      # acronym already written in the Word file always wins. Match is on the full
      # organization name (case + spacing ignored).
      - name: org-acronyms
        label: Organization acronyms
        file: src/data/org-abbreviations.json
        fields:
          - label: Acronyms
            name: overrides
            widget: keyvalue
            root: true
            required: false
            key_label: Organization full name (e.g. World Health Organization)
            value_label: Acronym (e.g. WHO)
